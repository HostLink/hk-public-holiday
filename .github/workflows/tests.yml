name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        symfony-cache: ["^6.4", "^7.0", "^8.0"]

    name: "symfony/cache ${{ matrix.symfony-cache }}"

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Force symfony/cache version
        run: composer require "symfony/cache:${{ matrix.symfony-cache }}" --no-interaction --prefer-dist --update-with-all-dependencies

      - name: Run tests
        run: ./vendor/bin/phpunit
