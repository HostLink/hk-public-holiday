name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - symfony-cache: "^6.4"
            php: "8.3"
          - symfony-cache: "^7.0"
            php: "8.3"
          - symfony-cache: "^8.0"
            php: "8.4"

    name: "symfony/cache ${{ matrix.symfony-cache }} / PHP ${{ matrix.php }}"

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Force symfony/cache version
        run: composer require "symfony/cache:${{ matrix.symfony-cache }}" --no-interaction --prefer-dist --update-with-all-dependencies

      - name: Run tests
        run: ./vendor/bin/phpunit
